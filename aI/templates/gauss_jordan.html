<!DOCTYPE html>
<html>
<head>
<title>Gauss–Jordan Method</title>
<style>
body{font-family:Arial; background:#e6faff;}
.container{width:90%; max-width:700px; margin:40px auto; background:#fff; padding:20px; border-radius:12px; box-shadow:0px 0px 10px #0002;}
h1{text-align:center;}
input{width:80px; margin:5px; padding:8px; border-radius:6px; border:1px solid #aaa;}
button{padding:10px 25px; background:#0097a7; border:none; color:white; border-radius:8px;}
button:hover{background:#006978;}
.matrix-row{display:flex; justify-content:center;}
</style>
</head>
<body>

<div class="container">
<h1>Gauss–Jordan (RREF)</h1>

<form method="POST" action="/gauss_jordan">
    <h3>Enter Augmented Matrix</h3>
    <div id="matrix"></div>

    <br>
    <button type="submit">Compute RREF</button>
</form>

</div>

<script>
const rows = 3, cols = 4;

let html = "";
for (let r = 0; r < rows; r++) {
    html += "<div class='matrix-row'>";
    for (let c = 0; c < cols; c++) {
        html += `<input type='number' name='m${r}${c}' required>`;
    }
    html += "</div>";
}
document.getElementById("matrix").innerHTML = html;
</script>

</body>
</html>
