// {% extends "base.html" %}

{% block content %}
<div class="row">
    <div class="col-lg-8 offset-lg-2">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/">Home</a></li>
                <li class="breadcrumb-item active">{{ op_name.replace('_', ' ').title() }}</li>
            </ol>
        </nav>
        
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h3 class="card-title mb-0">
                    <i class="fas {{ icons[op_name] }} me-2"></i>{{ op_name.replace('_', ' ').title() }}
                </h3>
            </div>
            <div class="card-body">
                {% if error %}
                <div class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="fas fa-exclamation-triangle me-2"></i>{{ error }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                {% endif %}
                
                {% if result %}
                <div class="alert alert-success alert-dismissible fade show" role="alert">
                    <i class="fas fa-check-circle me-2"></i>
                    <strong>Result:</strong>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                <div class="result-container p-3 bg-light rounded">
                    <pre class="mb-0">{{ result }}</pre>
                </div>
                {% endif %}
                
                <form id="operation-form" method="POST" class="mt-4">
                    <div id="form-fields">
                        <!-- Dynamic fields will be inserted here by JavaScript -->
                    </div>
                    <div class="text-center">
                        <button type="submit" class="btn btn-primary btn-lg px-5" id="calculateBtn">
                            <i class="fas fa-calculator me-2"></i>Calculate
                        </button>
                        <button type="button" class="btn btn-secondary btn-lg ms-2" onclick="resetForm()">
                            <i class="fas fa-redo me-2"></i>Reset
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const opName = '{{ op_name }}';
    generateForm(opName);
    
    // Add loading state to submit button
    document.getElementById('operation-form').addEventListener('submit', function() {
        const btn = document.getElementById('calculateBtn');
        btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Calculating...';
        btn.disabled = true;
    });
});

function resetForm() {
    document.getElementById('operation-form').reset();
    document.getElementById('form-fields').innerHTML = '';
    generateForm('{{ op_name }}');
}

function generateForm(opName) {
    const formFields = document.getElementById('form-fields');
    let html = '';
    
    if (['rank', 'minor', 'cofactor'].includes(opName)) {
        html += createMatrixInput('A', 'Matrix A');
        if (['minor', 'cofactor'].includes(opName)) {
            html += createIndexInputs();
        }
    } else if (opName === 'cramer') {
        html += createSizeInput('n', 'Matrix Size (n x n)');
        html += '<div class="mb-4"><button type="button" class="btn btn-outline-primary" onclick="generateSquareMatrix(\'A\', \'Coefficient Matrix A\')"><i class="fas fa-plus me-2"></i>Generate Matrix A</button></div>';
        html += '<div id="matrix-A-container"></div>';
        html += '<div class="mb-4"><button type="button" class="btn btn-outline-primary" onclick="generateVector(\'b\', \'Constant Vector b\')"><i class="fas fa-plus me-2"></i>Generate Vector b</button></div>';
        html += '<div id="vector-b-container"></div>';
    } else if (['addition', 'subtraction'].includes(opName)) {
        html += createMatrixInput('A', 'Matrix A');
        html += createMatrixInput('B', 'Matrix B');
    } else if (opName === 'multiplication') {
        html += createMatrixInput('A', 'Matrix A');
        html += createMatrixInput('B', 'Matrix B');
    } else if (['determinant', 'adjoint', 'inverse'].includes(opName)) {
        html += createSizeInput('n', 'Matrix Size (n x n)');
        html += '<div class="mb-4"><button type="button" class="btn btn-outline-primary" onclick="generateSquareMatrix(\'A\', \'Matrix A\')"><i class="fas fa-plus me-2"></i>Generate Matrix</button></div>';
        html += '<div id="matrix-A-container"></div>';
    } else if (['gauss_elimination', 'gauss_jordan'].includes(opName)) {
        html += createMatrixInput('A', 'Augmented Matrix [A|b]');
    }
    
    formFields.innerHTML = html;
}

function createMatrixInput(prefix, label) {
    const suffix = prefix === 'A' ? '' : '_' + prefix.toLowerCase();
    return `
        <div class="matrix-input-container mb-4">
            <h5 class="text-primary mb-3"><i class="fas fa-table me-2"></i>${label}</h5>
            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label">Rows</label>
                    <input type="number" name="rows${suffix}" class="form-control" min="1" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Columns</label>
                    <input type="number" name="cols${suffix}" class="form-control" min="1" required>
                </div>
            </div>
            <button type="button" class="btn btn-outline-primary mb-3" onclick="generateMatrix('${prefix}', '${label}')">
                <i class="fas fa-magic me-2"></i>Generate Matrix Input
            </button>
            <div id="matrix-${prefix.toLowerCase()}-container" class="matrix-display"></div>
        </div>
    `;
}

function createIndexInputs() {
    return `
        <div class="row g-3 mb-4">
            <div class="col-md-6">
                <label class="form-label">Row Index (0-based)</label>
                <input type="number" name
