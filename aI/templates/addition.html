<!DOCTYPE html>
<html>
<head>
<title>Matrix Addition</title>
<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f6f9;
    margin: 0;
}
.container {
    width: 90%;
    max-width: 700px;
    margin: 40px auto;
    padding: 20px;
    background: white;
    border-radius: 12px;
    box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
}
h1 {
    text-align: center;
}
input {
    width: 60px;
    padding: 8px;
    margin: 5px;
    font-size: 16px;
    border-radius: 6px;
    border: 1px solid #aaa;
}
button {
    padding: 10px 20px;
    font-size: 17px;
    border: none;
    background: #007bff;
    color: white;
    border-radius: 8px;
    cursor: pointer;
}
button:hover {
    background: #0056b3;
}
.matrix-row {
    display: flex;
    justify-content: center;
}
</style>
</head>
<body>

<div class="container">
    <h1>Matrix Addition</h1>

    <form method="POST" action="/add">
        <h3>Matrix A</h3>
        <div id="matrixA"></div>

        <h3>Matrix B</h3>
        <div id="matrixB"></div>

        <br>
        <button type="submit">Add Matrices</button>
    </form>
</div>

<script>
const rows = 3, cols = 3;

function createMatrix(id) {
    let html = "";
    for (let r = 0; r < rows; r++) {
        html += "<div class='matrix-row'>";
        for (let c = 0; c < cols; c++) {
            html += `<input type='number' name='${id}${r}${c}' required>`;
        }
        html += "</div>";
    }
    document.getElementById(id).innerHTML = html;
}

createMatrix("matrixA");
createMatrix("matrixB");
</script>

</body>
</html>
