<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cofactor Calculator</title>
    <link rel="stylesheet" href="/static/style14.css">
</head>

<body>

<div class="container">
    <h1>Cofactor Calculator</h1>

    <form id="cofactorForm">

        <label>Enter Matrix (row-by-row):</label>
        <textarea id="matrix" name="matrix" rows="5"
                  placeholder="1 2 3&#10;4 5 6&#10;7 8 9"></textarea>

        <label>Row Index:</label>
        <input type="number" id="row" name="row" placeholder="0">

        <label>Column Index:</label>
        <input type="number" id="col" name="col" placeholder="1">

        <button type="submit">Calculate Cofactor</button>
    </form>

    <div class="output" id="output"></div>
</div>


<script>
document.getElementById("cofactorForm").addEventListener("submit", async function (e) {
    e.preventDefault();

    let formData = new FormData();
    formData.append("matrix", document.getElementById("matrix").value);
    formData.append("row", document.getElementById("row").value);
    formData.append("col", document.getElementById("col").value);

    let res = await fetch("/cofactor", {
        method: "POST",
        body: formData
    });

    let data = await res.json();

    if (data.error) {
        document.getElementById("output").innerHTML =
            `<p class='error'>${data.error}</p>`;
    } else {
        document.getElementById("output").innerHTML =
            `<h2>Results</h2>
             <p><b>Minor Matrix:</b></p>
             <pre>${JSON.stringify(data.minor, null, 2)}</pre>

             <p><b>Cofactor Value:</b> ${data.cofactor}</p>`;
    }
});
</script>

</body>
</html>
